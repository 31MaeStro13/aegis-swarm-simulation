[project]
name = "aegis-swarm-simulation"
version = "0.1.0"
description = "Aegis SAR: Autonomous Swarm UAV Coordination 2D Simulation (MVP 0.1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
